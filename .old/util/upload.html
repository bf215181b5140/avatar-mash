<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .gallery {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .image-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .image-card:hover {
            transform: scale(1.05);
        }
        .image-card img {
            width: 400px;
            aspect-ratio: 3/4;
            object-fit: cover;
        }
        .upload-button {
            margin-top: 20px;
        }
        .upload-button input[type="file"] {
            display: none;
        }
        .upload-button label {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 16px;
            font-weight: 500;
        }
        .upload-button label:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>Image Gallery</h1>
    <div class="upload-button">
        <input type="file" id="imageUpload" accept="image/*" multiple>
        <label for="imageUpload">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" style="margin-right: 8px;">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
            Upload Images
        </label>
    </div>
    <div class="gallery" id="imageGallery"></div>

    <script>
        const gallery = document.getElementById('imageGallery');
        const imageUpload = document.getElementById('imageUpload');

        // Function to create image card
        function createImageCard(src) {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.innerHTML = `<img src="${src}" alt="Gallery Image">`;
            card.addEventListener('click', () => {
                // Add your upload logic here
                console.log('Image selected:', src);
            });
            return card;
        }

        // Function to display images from the page
        function displayImages() {
            // Get all images from the page
            const images = document.images;
            for (const img of images) {
                const card = createImageCard(img.src);
                gallery.appendChild(card);
            }
        }

        // Function to handle file upload
        async function handleFileUpload(event) {
            const files = event.target.files;
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const card = createImageCard(e.target.result);
                        gallery.appendChild(card);
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        // Initialize
        displayImages();
        imageUpload.addEventListener('change', handleFileUpload);
    </script>
</body>
</html>
